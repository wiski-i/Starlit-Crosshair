name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build, test and package
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build.bat, tests\Run.bat and portable ZIP
        shell: powershell
        run: .\Prepare-Release.ps1
      - name: Match tag to EXE product version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo("$PWD\OzelCrosshair.exe").ProductVersion
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match EXE product version $version."
          }
      - name: Save regression screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-screenshots
          path: test-results/*.png
          if-no-files-found: warn
      - name: Save portable release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-portable
          path: |
            dist/Starlit-Crosshair-*-windows.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-portable
          path: dist
      - name: Create release or refresh existing assets
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = @((Get-ChildItem -LiteralPath dist -Filter '*.zip').FullName)
          if ($files.Count -ne 1) { throw 'Expected exactly one portable ZIP.' }
          $files += (Join-Path $PWD 'dist\SHA256SUMS.txt')
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json id
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag @files --verify-tag --title "Starlit Crosshair $tag" --notes-file RELEASE_NOTES.md --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
